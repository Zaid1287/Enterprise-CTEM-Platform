openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CTEM Platform API — Continuous Threat Exposure Management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: tenants
    description: Tenant management
  - name: users
    description: User management
  - name: assets
    description: Asset management
  - name: asset-groups
    description: Asset group management
  - name: scans
    description: Scan management
  - name: findings
    description: Vulnerability findings
  - name: compliance
    description: Compliance management
  - name: reports
    description: Report management
  - name: alerts
    description: Alert management
  - name: risk
    description: Risk scoring
  - name: audit
    description: Audit logs
  - name: ai-copilot
    description: AI Security Copilot
  - name: ai-mapper
    description: AI Mapper — discover and assess exposed AI infrastructure
  - name: dashboard
    description: Dashboard and analytics
  - name: discovery
    description: Passive discovery engine — CT logs, WHOIS, ASN, DKIM, GitHub, and commercial intel APIs
  - name: tprm
    description: Third Party Risk Management — vendor risk scoring, supply chain, compliance, SBOM, 4th-party discovery
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ──────────────────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already in use

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed

  # ──────────────────────────────────────────────────────────
  # TENANTS
  # ──────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants (super admin only)
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get tenant by ID
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  # ──────────────────────────────────────────────────────────
  # USERS
  # ──────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in current tenant
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deleted

  # ──────────────────────────────────────────────────────────
  # ASSETS
  # ──────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List all assets
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: verificationStatus
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Add a new asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{assetId}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get asset by ID
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Asset deleted

  /assets/{assetId}/verify:
    post:
      operationId: verifyAsset
      tags: [assets]
      summary: Initiate asset ownership verification
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationInput"
      responses:
        "200":
          description: Verification initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChallenge"

  /assets/{assetId}/verify/check:
    post:
      operationId: checkAssetVerification
      tags: [assets]
      summary: Check if asset ownership is verified
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"

  /assets/{assetId}/technologies:
    get:
      operationId: listAssetTechnologies
      tags: [assets]
      summary: List detected technologies for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of technology detections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechnologyDetection"

  /assets/{assetId}/tech-scan:
    post:
      operationId: runTechScan
      tags: [assets]
      summary: Run real HTTP technology fingerprinting on an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tech scan results
          content:
            application/json:
              schema:
                type: object
                required: [technologies, scannedAt]
                properties:
                  technologies:
                    type: array
                    items:
                      $ref: "#/components/schemas/TechnologyDetection"
                  scannedAt:
                    type: string

  # ──────────────────────────────────────────────────────────
  # SCREENSHOTS
  # ──────────────────────────────────────────────────────────
  /assets/{assetId}/screenshots:
    get:
      operationId: listAssetScreenshots
      tags: [assets]
      summary: List screenshots captured for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of screenshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Screenshot"

  /assets/{assetId}/screenshot-scan:
    post:
      operationId: runScreenshotScan
      tags: [assets]
      summary: Capture live screenshots of login, signup, index, admin, and sensitive pages for an asset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Screenshot scan results
          content:
            application/json:
              schema:
                type: object
                required: [screenshots, capturedAt]
                properties:
                  screenshots:
                    type: array
                    items:
                      $ref: "#/components/schemas/Screenshot"
                  capturedAt:
                    type: string

  # ──────────────────────────────────────────────────────────
  # ASSET GROUPS
  # ──────────────────────────────────────────────────────────
  /asset-groups:
    get:
      operationId: listAssetGroups
      tags: [asset-groups]
      summary: List asset groups
      responses:
        "200":
          description: List of asset groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetGroup"
    post:
      operationId: createAssetGroup
      tags: [asset-groups]
      summary: Create asset group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetGroupInput"
      responses:
        "201":
          description: Asset group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetGroup"

  /asset-groups/{groupId}:
    get:
      operationId: getAssetGroup
      tags: [asset-groups]
      summary: Get asset group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetGroup"
    patch:
      operationId: updateAssetGroup
      tags: [asset-groups]
      summary: Update asset group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetGroupUpdate"
      responses:
        "200":
          description: Updated asset group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetGroup"
    delete:
      operationId: deleteAssetGroup
      tags: [asset-groups]
      summary: Delete asset group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /asset-groups/{groupId}/members:
    get:
      operationId: getAssetGroupMembers
      tags: [asset-groups]
      summary: List assets in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assets in the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    put:
      operationId: setAssetGroupMembers
      tags: [asset-groups]
      summary: Set assets in a group (replaces all members)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetGroupMembersInput"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetGroup"

  # ──────────────────────────────────────────────────────────
  # SCANS
  # ──────────────────────────────────────────────────────────
  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List all scans
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: assetId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
    post:
      operationId: createScan
      tags: [scans]
      summary: Create and schedule a scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "201":
          description: Scan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"

  /scans/{scanId}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get scan details
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
    delete:
      operationId: deleteScan
      tags: [scans]
      summary: Cancel or delete a scan
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /scans/{scanId}/cancel:
    post:
      operationId: cancelScan
      tags: [scans]
      summary: Cancel a running scan
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"

  /scans/pipeline-run:
    post:
      operationId: runPipelineScan

      tags: [scans]
      summary: Run pipeline tools against selected assets and save structured findings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineScanInput"
      responses:
        "201":
          description: Scan started and completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineScanCreated"

  /scans/schedules:
    get:
      operationId: listScanSchedules
      tags: [scans]
      summary: List all scan schedules
      responses:
        "200":
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanSchedule"
    post:
      operationId: createScanSchedule
      tags: [scans]
      summary: Create a scan schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanScheduleInput"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSchedule"

  /scans/schedules/{scheduleId}:
    get:
      operationId: getScanSchedule
      tags: [scans]
      summary: Get a scan schedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Schedule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSchedule"
    patch:
      operationId: updateScanSchedule
      tags: [scans]
      summary: Update a scan schedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanScheduleUpdate"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSchedule"
    delete:
      operationId: deleteScanSchedule
      tags: [scans]
      summary: Delete a scan schedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /scans/schedules/{scheduleId}/run-now:
    post:
      operationId: runScheduleNow
      tags: [scans]
      summary: Trigger a scheduled scan immediately
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineScanCreated"

  /scans/{scanId}/stop:
    post:
      operationId: stopScan
      tags: [scans]
      summary: Stop a running scan
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"

  /scans/{scanId}/asset-report:
    get:
      operationId: getScanAssetReport
      tags: [scans]
      summary: Get detailed per-asset structured results for a pipeline scan
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-asset scan results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetScanReport"

  /scans/{scanId}/jobs:
    get:
      operationId: listScanJobs
      tags: [scans]
      summary: List scan jobs for a scan
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanJob"

  # ──────────────────────────────────────────────────────────
  # FINDINGS
  # ──────────────────────────────────────────────────────────
  /findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: List vulnerability findings
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: assetId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: newSinceScanId
          in: query
          schema:
            type: integer
        - name: isStale
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Finding"

  /findings/{findingId}:
    get:
      operationId: getFinding
      tags: [findings]
      summary: Get finding details
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Finding details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
    patch:
      operationId: updateFinding
      tags: [findings]
      summary: Update finding status or details
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingUpdate"
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"

  /findings/{findingId}/scan-data:
    get:
      operationId: getFindingScanData
      tags: [findings]
      summary: Get aggregated scan data for the asset linked to a finding
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan data for the finding asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingScanData"

  /findings/{findingId}/comments:
    get:
      operationId: listFindingComments
      tags: [findings]
      summary: Get comments for a finding
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FindingComment"
    post:
      operationId: createFindingComment
      tags: [findings]
      summary: Add a comment to a finding
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingCommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingComment"

