          type: number

    SeverityCount:
      type: object
      required: [severity, count]
      properties:
        severity:
          type: string
        count:
          type: integer

    AssetTypeCount:
      type: object
      required: [type, count]
      properties:
        type:
          type: string
        count:
          type: integer

    AssetRiskSummary:
      type: object
      required: [assetId, assetName, assetType, riskScore, riskLevel, findingsCount]
      properties:
        assetId:
          type: integer
        assetName:
          type: string
        assetType:
          type: string
        riskScore:
          type: number
        riskLevel:
          type: string
        findingsCount:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          type: ["string", "null"]
        createdAt:
          type: string

    ExposureCount:
      type: object
