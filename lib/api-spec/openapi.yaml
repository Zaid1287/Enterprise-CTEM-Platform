components:
  schemas:
    AiMapperSummary:
      type: object
      required: [totalEndpoints, unauthEndpoints, highRiskEndpoints, serviceBreakdown]
      properties:
        totalEndpoints:
          type: integer
        unauthEndpoints:
          type: integer
        highRiskEndpoints:
          type: integer
        serviceBreakdown:
          type: object
          additionalProperties:
            type: integer
        lastScanAt:
          type: string
          nullable: true

    AiMapperScan:
      type: object
      required: [id, tenantId, status, resultCount, unauthCount, highRiskCount, startedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        status:
          type: string
        resultCount:
          type: integer
        unauthCount:
          type: integer
        highRiskCount:
          type: integer
        error:
          type: string
          nullable: true
        startedAt:
          type: string
        completedAt:
          type: string
          nullable: true

    AiMapperScanInput:
      type: object
      properties:
        assetIds:
          type: array
          items:
            type: integer

    AiMapperResult:
      type: object
      required: [id, scanId, tenantId, url, serviceType, isAuthenticated, riskScore, riskLevel, discoveredAt]
      properties:
        id:
          type: integer
        scanId:
          type: integer
        tenantId:
          type: integer
        assetId:
          type: integer
          nullable: true
        url:
          type: string
        host:
          type: string
          nullable: true
        port:
          type: integer
          nullable: true
        serviceType:
          type: string
        framework:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        isAuthenticated:
          type: boolean
        corsPolicy:
          type: string
          nullable: true
        riskScore:
          type: integer
        riskLevel:
          type: string
        modelsExposed:
          type: array
          items:
            type: string
          nullable: true
        toolsExposed:
          type: array
          items:
            type: string
          nullable: true
        ip:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        org:
          type: string
          nullable: true
        discoveredAt:
          type: string

    AiMapperScanDetail:
      allOf:
        - $ref: "#/components/schemas/AiMapperScan"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/AiMapperResult"

    AiMapperResultsPage:
      type: object
      required: [results, total, page, limit]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/AiMapperResult"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    AiMapperGlobePoint:
      type: object
      required: [country, countryCode, count, highRisk, services]
      properties:
        country:
          type: string
        countryCode:
          type: string
        count:
          type: integer
        highRisk:
          type: integer
        services:
          type: array
          items:
            type: string

    AiMapperGlobeData:
      type: object
      required: [points, totalEndpoints]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/AiMapperGlobePoint"
        totalEndpoints:
          type: integer

    AiMapperAnalysis:
      type: object
      required: [analysis, suggestions, riskLevel, model]
      properties:
        analysis:
          type: string
        suggestions:
          type: array
          items:
            type: string
        riskLevel:
          type: string
        model:
          type: string

    DiscoveryModuleResult:
      type: object
      required: [source, status, summary]
      properties:
        source:
          type: string
        status:
          type: string
          enum: [ok, skipped, error]
        data:
          type: object
          nullable: true
        summary:
          type: string

    DiscoveryRunResult:
      type: object
      required: [assetId, results]
      properties:
        assetId:
          type: integer
        asset:
          type: object
        results:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryModuleResult"
        savedIds:
          type: array
          items:
            type: integer

    DiscoveryResultsResponse:
      type: object
      required: [assetId, totalResults, results]
      properties:
        assetId:
          type: integer
        asset:
          type: object
        totalResults:
          type: integer
        bySource:
          type: object
        results:
          type: array
          items:
            type: object

    DiscoveryLatestResponse:
      type: object
      required: [assetId, sources]
      properties:
        assetId:
          type: integer
        asset:
          type: object
        sources:
          type: array
          items:
            type: object

    ScreenshotFinding:
      type: object
      required: [type, value, severity]
      properties:
        type:
          type: string
        value:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        context:
          type: string
          nullable: true

    Screenshot:
      type: object
      required: [id, tenantId, assetId, url, pageType, screenshotData, capturedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        assetId:
          type: integer
        scanId:
          type: integer
          nullable: true
        url:
          type: string
        pageType:
          type: string
        screenshotData:
          type: string
          description: Base64-encoded PNG screenshot
        title:
          type: string
          nullable: true
        statusCode:
          type: integer
          nullable: true
        findings:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ScreenshotFinding"
        capturedAt:
          type: string

    DiscoveredPort:
      type: object
      required: [port, protocol, state, source]
      properties:
        port:
          type: integer
        protocol:
          type: string
        state:
          type: string
        service:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        source:
          type: string
        banner:
          type: string
          nullable: true

    TechnologyDetection:
      type: object
      required: [id, assetId, technology, slug, category, confidence, detectedAt]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        scanId:
          type: integer
          nullable: true
        technology:
          type: string
        slug:
          type: string
        category:
          type: string
        version:
          type: string
          nullable: true
        confidence:
          type: integer
        website:
          type: string
          nullable: true
        cpe:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        detectedAt:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ──────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [email, password, firstName, lastName, tenantName]
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        tenantName:
          type: string

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ── User ─────────────────────────────────────────────
    User:
      type: object
      required: [id, email, firstName, lastName, role, tenantId, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        tenantId:
          type: integer
        isActive:
          type: boolean
        lastLoginAt:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [email, firstName, lastName, role, password]
      properties:
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        password:
          type: string

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        isActive:
          type: boolean

    # ── Tenant ────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, slug, plan, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        isActive:
          type: boolean
        maxAssets:
          type: ["integer", "null"]
        maxUsers:
          type: ["integer", "null"]
        createdAt:
          type: string

    TenantInput:
      type: object
      required: [name, slug, plan]
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        maxAssets:
          type: integer
        maxUsers:
          type: integer

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
        plan:
          type: string
        isActive:
          type: boolean
        maxAssets:
          type: integer
        maxUsers:
          type: integer

    # ── Asset ─────────────────────────────────────────────
