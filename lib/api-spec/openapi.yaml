components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ──────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [email, password, firstName, lastName, tenantName]
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        tenantName:
          type: string

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ── User ─────────────────────────────────────────────
    User:
      type: object
      required: [id, email, firstName, lastName, role, tenantId, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        tenantId:
          type: integer
        isActive:
          type: boolean
        lastLoginAt:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [email, firstName, lastName, role, password]
      properties:
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        password:
          type: string

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        isActive:
          type: boolean

    # ── Tenant ────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, slug, plan, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        isActive:
          type: boolean
        maxAssets:
          type: ["integer", "null"]
        maxUsers:
          type: ["integer", "null"]
        createdAt:
          type: string

    TenantInput:
      type: object
      required: [name, slug, plan]
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        maxAssets:
          type: integer
        maxUsers:
          type: integer

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
        plan:
          type: string
        isActive:
          type: boolean
        maxAssets:
          type: integer
        maxUsers:
          type: integer

    # ── Asset ─────────────────────────────────────────────
    Asset:
      type: object
      required: [id, tenantId, name, type, value, verificationStatus, riskLevel, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        type:
          type: string
        value:
          type: string
        verificationStatus:
          type: string
        riskLevel:
          type: string
        tags:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        port:
          type: ["integer", "null"]
        isActive:
          type: boolean
        lastScannedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    AssetInput:
      type: object
      required: [name, type, value]
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        ipAddress:
          type: string
        port:
          type: integer

    AssetUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        riskLevel:
          type: string

    VerificationInput:
      type: object
      required: [method]
      properties:
        method:
          type: string

    VerificationChallenge:
      type: object
      required: [method, challenge, instructions]
      properties:
        method:
          type: string
        challenge:
          type: string
        instructions:
          type: string

    VerificationResult:
      type: object
      required: [verified, message]
      properties:
        verified:
          type: boolean
        message:
          type: string

    # ── Asset Group ───────────────────────────────────────
    AssetGroup:
      type: object
      required: [id, tenantId, name, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        assetCount:
          type: integer
        createdAt:
          type: string

    AssetGroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        assetIds:
          type: array
          items:
            type: integer

    AssetGroupUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    # ── Scan ──────────────────────────────────────────────
    Scan:
      type: object
      required: [id, tenantId, name, type, status, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        type:
          type: string
        status:
          type: string
        schedule:
          type: ["string", "null"]
        assetIds:
          type: array
          items:
            type: integer
        findingsCount:
          type: integer
        startedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ScanInput:
      type: object
      required: [name, type, assetIds]
      properties:
        name:
          type: string
        type:
          type: string
        assetIds:
          type: array
          items:
            type: integer
        schedule:
          type: string
        scanModules:
          type: array
          items:
            type: string

    ScanJob:
      type: object
      required: [id, scanId, assetId, status, createdAt]
      properties:
        id:
          type: integer
        scanId:
          type: integer
        assetId:
          type: integer
        status:
          type: string
        result:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Finding ───────────────────────────────────────────
    Finding:
      type: object
      required: [id, tenantId, assetId, title, severity, status, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        assetId:
          type: integer
        assetName:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        severity:
          type: string
        status:
          type: string
        cve:
          type: ["string", "null"]
        cvss:
          type: ["number", "null"]
        epss:
          type: ["number", "null"]
        cwe:
          type: ["string", "null"]
        isKev:
          type: boolean
        remediation:
          type: ["string", "null"]
        evidence:
          type: ["string", "null"]
        riskScore:
          type: ["number", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    FindingUpdate:
      type: object
      properties:
        status:
          type: string
        remediation:
          type: string
        evidence:
          type: string

    FindingComment:
      type: object
      required: [id, findingId, userId, content, createdAt]
      properties:
        id:
          type: integer
        findingId:
          type: integer
        userId:
          type: integer
        authorName:
          type: string
        content:
          type: string
        createdAt:
          type: string

    FindingCommentInput:
      type: object
      required: [content]
      properties:
        content:
          type: string

    # ── Compliance ────────────────────────────────────────
    ComplianceFramework:
      type: object
      required: [id, name, shortName, version, totalControls]
      properties:
        id:
          type: integer
        name:
          type: string
        shortName:
          type: string
        version:
          type: string
        totalControls:
          type: integer
        description:
          type: ["string", "null"]

    ComplianceControl:
      type: object
      required: [id, frameworkId, frameworkName, controlId, title, status, createdAt]
      properties:
        id:
          type: integer
        frameworkId:
          type: integer
        frameworkName:
          type: string
        controlId:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
        evidence:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string

    ComplianceControlUpdate:
      type: object
      properties:
        status:
          type: string
        evidence:
          type: string
        assignedTo:
          type: string
        dueDate:
          type: string

    ComplianceSummary:
      type: object
      required: [frameworkId, frameworkName, shortName, total, compliant, inProgress, nonCompliant, score]
      properties:
        frameworkId:
          type: integer
        frameworkName:
          type: string
        shortName:
          type: string
        total:
          type: integer
        compliant:
          type: integer
        inProgress:
          type: integer
        nonCompliant:
          type: integer
        score:
          type: number

    # ── Report ────────────────────────────────────────────
    Report:
      type: object
      required: [id, tenantId, title, type, format, status, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        title:
          type: string
        type:
          type: string
        format:
          type: string
        status:
          type: string
        downloadUrl:
          type: ["string", "null"]
        generatedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ReportInput:
      type: object
      required: [title, type, format]
      properties:
        title:
          type: string
        type:
          type: string
        format:
          type: string
        assetIds:
          type: array
          items:
            type: integer
        dateFrom:
          type: string
        dateTo:
          type: string

    # ── Alert ─────────────────────────────────────────────
    Alert:
      type: object
      required: [id, tenantId, title, type, severity, isRead, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        title:
          type: string
        message:
          type: ["string", "null"]
        type:
          type: string
        severity:
          type: string
        isRead:
          type: boolean
        relatedAssetId:
          type: ["integer", "null"]
        relatedFindingId:
          type: ["integer", "null"]
        createdAt:
          type: string

    AlertUpdate:
      type: object
      properties:
        isRead:
          type: boolean

    AlertRule:
      type: object
      required: [id, tenantId, name, triggerType, channel, isActive, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        triggerType:
          type: string
        channel:
          type: string
        destination:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    AlertRuleInput:
      type: object
      required: [name, triggerType, channel]
      properties:
        name:
          type: string
        triggerType:
          type: string
        channel:
          type: string
        destination:
          type: string

    # ── Risk ──────────────────────────────────────────────
    RiskScore:
      type: object
      required: [id, assetId, assetName, score, level, cvssComponent, epssComponent, kevBonus, criticalityBonus, exposureBonus, updatedAt]
      properties:
        id:
          type: integer
        assetId:
          type: integer
        assetName:
          type: string
        score:
          type: number
        level:
          type: string
        cvssComponent:
          type: number
        epssComponent:
          type: number
        kevBonus:
          type: number
        criticalityBonus:
          type: number
        exposureBonus:
          type: number
        updatedAt:
          type: string

    # ── Audit Log ─────────────────────────────────────────
    AuditLog:
      type: object
      required: [id, tenantId, userId, action, resource, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        userId:
          type: integer
        userEmail:
          type: ["string", "null"]
        action:
          type: string
        resource:
          type: string
        resourceId:
          type: ["integer", "null"]
        details:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── AI Copilot ────────────────────────────────────────
    AiExplainFindingInput:
      type: object
      required: [findingId]
      properties:
        findingId:
          type: integer

    AiRemediationInput:
      type: object
      required: [findingId]
      properties:
        findingId:
          type: integer
        context:
          type: string

    AiSummaryInput:
      type: object
      required: [tenantId]
      properties:
        tenantId:
          type: integer
        dateFrom:
          type: string
        dateTo:
          type: string

    AiComplianceInput:
      type: object
      required: [controlId]
      properties:
        controlId:
          type: integer

    AiExplanation:
      type: object
      required: [content, model]
      properties:
        content:
          type: string
        model:
          type: string
        generatedAt:
          type: string

    AiRemediation:
      type: object
      required: [steps, priority, estimatedEffort, model]
      properties:
        steps:
          type: array
          items:
            type: string
        priority:
          type: string
        estimatedEffort:
          type: string
        references:
          type: array
          items:
            type: string
        model:
          type: string

    # ── Dashboard ─────────────────────────────────────────
    DashboardOverview:
      type: object
      required: [totalAssets, totalFindings, criticalFindings, highFindings, openFindings, activeScans, complianceScore, riskScore, unreadAlerts]
      properties:
        totalAssets:
          type: integer
        totalFindings:
          type: integer
        criticalFindings:
          type: integer
        highFindings:
          type: integer
        openFindings:
          type: integer
        activeScans:
          type: integer
        complianceScore:
          type: number
        riskScore:
          type: number
        unreadAlerts:
          type: integer
        assetsTrend:
          type: number
        findingsTrend:
          type: number

    TrendPoint:
      type: object
